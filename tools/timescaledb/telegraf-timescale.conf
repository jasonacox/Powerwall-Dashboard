# Telegraf configuration: Powerwall Dashboard -> TimescaleDB (PostgreSQL)
#
# A second, independent Telegraf instance (the telegraf-timescale service in
# tools/timescaledb/powerwall.extend.yml.sample). It polls the same pypowerwall
# endpoints as the stock telegraf.conf, plus weather411's JSON endpoint, and
# writes to TimescaleDB instead of InfluxDB. The pypowerwall proxy caches its
# responses, so the Powerwall itself isn't polled twice. See the stock
# telegraf.conf for the full annotated plugin reference.
#
# Telegraf writes raw rows (tables http, alerts, weather, powerwall_dashboard);
# the aggregate-cron service turns those into the pw_* tables the dashboard
# reads (see tools/timescaledb/db/aggregate/).
#
# ${POSTGRES_USER}/${POSTGRES_PASSWORD}/${POSTGRES_DB}/${TIMESCALEDB_HOST}/
# ${TIMESCALEDB_PORT}/${TIMESCALEDB_SSLMODE}/${TZ} come from
# tools/timescaledb/timescaledb.env.

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 360
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false


###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

[[outputs.postgresql]]
	connection = "host=${TIMESCALEDB_HOST} port=${TIMESCALEDB_PORT} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=${TIMESCALEDB_SSLMODE}"
	schema = "public"
	tags_as_foreign_keys = false
	# Raw tables (http, alerts) don't exist yet on a fresh install -- Telegraf
	# creates them on first write. This template makes that first creation a
	# hypertable immediately, instead of a plain table needing a separate
	# conversion step (db/aggregate/bootstrap_raw_tables.sql still
	# runs periodically too, to add the retention policy and as a defensive
	# fallback -- see that file's header comment).
	create_templates = [
		'''CREATE TABLE {{ .table }} ({{ .allColumns }})''',
		'''SELECT create_hypertable({{ .table|quoteLiteral }}, 'time', chunk_time_interval => INTERVAL '1 day')''',
	]


###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

[[inputs.http]]
	urls = [
		"http://pypowerwall:8675/aggregates",
		"http://pypowerwall:8675/soe",
		"http://pypowerwall:8675/strings",
		"http://pypowerwall:8675/temps/pw",
		"http://pypowerwall:8675/freq",
		"http://pypowerwall:8675/pod",
		"http://pypowerwall:8675/fans/pw"
	]
	method = "GET"
	insecure_skip_verify = true
	timeout = "4s"
	data_format = "json"

[[processors.date]]
	tag_key = "month"
	date_format = "Jan"
	timezone = "${TZ}"

[[processors.date]]
	tag_key = "year"
	date_format = "2006"
	timezone = "${TZ}"

# Alert Data
[[inputs.http]]
	urls = [
		"http://pypowerwall:8675/alerts/pw"
	]
	name_override = "alerts"
	method = "GET"
	insecure_skip_verify = true
	timeout = "4s"
	data_format = "json"

# Version info for the "Powerwall Dashboard" stat panel -- same ver.sh used
# by the stock telegraf.conf, mounted read-only into this container too (see
# powerwall.extend.yml.sample). Written to its own lazily-created "powerwall_dashboard"
# table (hypertabled/retained by bootstrap_raw_tables.sql, same as http/alerts).
[[inputs.exec]]
	commands = ["/etc/telegraf/ver.sh"]
	name_override = "powerwall_dashboard"
	data_format = "influx"

# Weather Data -- weather411's current conditions, timestamped with
# OpenWeatherMap's observation time. weather411 only refreshes every few
# minutes, so repeated identical polls are expected; aggregate_weather.sql
# de-duplicates them into pw_weather_log.
[[inputs.http]]
	urls = [
		"http://weather411:8676/all"
	]
	name_override = "weather"
	interval = "60s"
	method = "GET"
	timeout = "4s"
	data_format = "json"
	json_time_key = "dt"
	json_time_format = "unix"
	json_string_fields = [
		"name",
		"country",
		"weather_main",
		"weather_description",
		"weather_icon"
	]
